name: Hermes

options:
  bundleIdPrefix: app.dedala
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: KHZGP69E97
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator

packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw
    exactVersion: 0.29.0

targets:
  Hermes:
    type: application
    platform: iOS
    sources:
      - path: Hermes
        excludes: [AppIcon.icon]
      - path: Hermes/AppIcon.icon
        type: file
        buildPhase: resources
      - Shared
      - path: plugin/dedala/helpers.js
        buildPhase: resources
      - path: LICENSES/AGPL-3.0-or-later.txt
        buildPhase: resources
      - path: LICENSES/MIT.txt
        buildPhase: resources
      - path: LICENSES/Zlib.txt
        buildPhase: resources
      - path: LICENSES/LicenseRef-Avataaars.txt
        buildPhase: resources
    dependencies:
      - target: HermesWidgets
      - target: HermesNotifications
      - target: HermesSpotlight
      - target: HermesShare
      - package: SwiftDraw
      - framework: native/Org.xcframework
        embed: false
    info:
      path: Hermes/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: hermes
            CFBundleURLSchemes: [hermes]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dedala
        CODE_SIGN_ENTITLEMENTS: Hermes/Hermes.entitlements

        REGISTER_APP_GROUPS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dedala
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_NSCameraUsageDescription: To scan the pairing code your assistant shows, and to take a photo a page asks for.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: To hear what you tell your assistant when you hold its pill, or dictate on a page.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: To write down what you say, on the phone.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Your assistant asks for Face ID before acting on sensitive things.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  HermesWidgets:
    type: app-extension
    platform: iOS
    dependencies:
      - framework: native/Org.xcframework
        embed: false
    sources:
      - path: HermesWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - Shared
      - Hermes/UI
      - path: plugin/dedala/helpers.js
        buildPhase: resources
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        PRODUCT_BUNDLE_IDENTIFIER: app.dedala.widgets
        CODE_SIGN_ENTITLEMENTS: HermesWidgets/HermesWidgets.entitlements
        REGISTER_APP_GROUPS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HermesWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dedala
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES

  HermesNotifications:
    type: app-extension
    platform: iOS
    dependencies:
      - framework: native/Org.xcframework
        embed: false
    sources:
      - path: HermesNotifications
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
        excludes:
          - WidgetChoice.swift
      - Hermes/UI
      - path: plugin/dedala/helpers.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dedala.notifications
        CODE_SIGN_ENTITLEMENTS: HermesNotifications/HermesNotifications.entitlements
        REGISTER_APP_GROUPS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HermesNotifications/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dedala
        SKIP_INSTALL: YES

  HermesSpotlight:
    type: app-extension
    platform: iOS
    sources:
      - path: HermesSpotlight
        excludes:
          - Info.plist
          - "*.entitlements"
      - Shared/SpotlightItems.swift
      - Shared/HermesActivityAttributes.swift
      - Shared/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dedala.spotlight
        CODE_SIGN_ENTITLEMENTS: HermesSpotlight/HermesSpotlight.entitlements
        REGISTER_APP_GROUPS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HermesSpotlight/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dedala
        SKIP_INSTALL: YES

  HermesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HermesShare
        excludes:
          - Info.plist
          - "*.entitlements"
          - Page.js
      - path: HermesShare/Page.js
        buildPhase: resources
      - Shared/PairingStore.swift
      - Shared/Seal.swift
      - Shared/HermesActivityAttributes.swift
      - Shared/RelayPost.swift
      - Shared/ShareOutbox.swift
      - Shared/PrivacyInfo.xcprivacy
      - Hermes/UI/JSONValue.swift
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        PRODUCT_BUNDLE_IDENTIFIER: app.dedala.share
        CODE_SIGN_ENTITLEMENTS: HermesShare/HermesShare.entitlements
        REGISTER_APP_GROUPS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HermesShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dedala
        SKIP_INSTALL: YES

  HermesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesTests
      - path: plugin/dedala/grammar.json
        buildPhase: resources
    dependencies:
      - target: Hermes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dedala.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO

schemes:
  Hermes:
    build:
      targets:
        Hermes: all
        HermesTests: [test]
    test:
      targets:
        - HermesTests
